name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - shell: pwsh
        run: ./build-installer.ps1
      - shell: pwsh
        run: |
          if (-not (Test-Path './output/TunnelGate.exe')) { throw 'TunnelGate.exe is missing.' }
          if (-not (Test-Path './installer-output/TunnelGate-Setup.exe')) { throw 'TunnelGate-Setup.exe is missing.' }
