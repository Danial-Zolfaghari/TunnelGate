name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine release
        id: meta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') { $tag = $env:GITHUB_REF_NAME } else { $tag = 'v3.1.14' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }

      - name: Restore tests
        if: steps.meta.outputs.exists != 'true'
        run: dotnet restore .\tests\TunnelGate.Tests\TunnelGate.Tests.csproj

      - name: Unit tests
        if: steps.meta.outputs.exists != 'true'
        run: dotnet test .\tests\TunnelGate.Tests\TunnelGate.Tests.csproj -c Release --no-restore

      - name: Build application and installer
        if: steps.meta.outputs.exists != 'true'
        shell: pwsh
        run: ./build-installer.ps1

      - name: Create checksums
        if: steps.meta.outputs.exists != 'true'
        shell: pwsh
        run: |
          $files = @('./output/TunnelGate.exe', './installer-output/TunnelGate-Setup.exe')
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Encoding ascii SHA256SUMS.txt

      - name: Publish GitHub Release
        if: steps.meta.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: gh release create $env:RELEASE_TAG --target $env:GITHUB_SHA --title $env:RELEASE_TAG --generate-notes ./output/TunnelGate.exe ./installer-output/TunnelGate-Setup.exe ./SHA256SUMS.txt
